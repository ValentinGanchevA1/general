pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        // GHA runners occasionally get HTTP 403 from repo.maven.apache.org;
        // Google's public mirror keeps plugin resolution working.
        maven {
            url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
            name = "GoogleMavenCentralMirror"
        }
    }
    includeBuild("../node_modules/@react-native/gradle-plugin")
}
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'G88'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

// Project dependency resolution. Prefer google() for AndroidX/Material so those
// never hit Maven Central. Mirror covers intermittent 403s from Central on GHA.
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven {
            url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
            name = "GoogleMavenCentralMirror"
        }
        maven { url = uri("https://www.jitpack.io") }
    }
}
