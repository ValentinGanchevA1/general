pluginManagement {
    repositories {
        google()
        // Prefer Google's public Central mirror before repo.maven.apache.org —
        // GHA runners regularly hit HTTP 429/403 from Maven Central.
        maven {
            url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
            name = "GoogleMavenCentralMirror"
        }
        mavenCentral()
        gradlePluginPortal()
    }
    includeBuild("../node_modules/@react-native/gradle-plugin")
}
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'G88'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

// Project dependency resolution. Prefer google() for AndroidX/Material so those
// never hit Maven Central. Mirror covers intermittent 429/403s from Central on GHA.
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        maven {
            url = uri("https://maven-central.storage-download.googleapis.com/maven2/")
            name = "GoogleMavenCentralMirror"
        }
        mavenCentral()
        maven { url = uri("https://www.jitpack.io") }
    }
}
