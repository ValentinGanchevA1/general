version: 2
updates:
  # pnpm workspace: the root lockfile covers the monorepo applications/packages.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Sofia"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Europe/Sofia"
    open-pull-requests-limit: 3
    groups:
      actions-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/apps/mobile/android"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Europe/Sofia"
    open-pull-requests-limit: 3
