name: Android Release (AAB)

# Builds a signed Android App Bundle for Google Play (closed testing / production).
# Manual builds via Actions, or build-only on v* tag pushes (no implicit Play upload).
# The first upload to the Play Console must be done by hand (Play requires it to
# establish the app); afterwards the .aab artifact from here can be uploaded
# manually or wired to a service-account auto-publish step (see DEPLOY.md).
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to publish to (e.g. closed track name, 'alpha', or 'internal')"
        required: false
        default: "alpha"
      version_code:
        description: "Optional explicit Android versionCode (RC2 internal: 6); empty uses workflow run number"
        required: false
        default: ""
      publish:
        description: "Explicitly opt in to Play upload (default is safe build-only; requires PLAY_SERVICE_ACCOUNT_JSON)"
        type: boolean
        required: false
        default: false
      status:
        description: "Release status on the track"
        type: choice
        required: false
        default: "completed"
        options: ["completed", "draft", "halted", "inProgress"]
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Signed AAB
    runs-on: ubuntu-latest
    # Surface secret presence as a plain env value so the publish step's `if:`
    # can gate on it (the `secrets` context isn't allowed in `if:` directly).
    env:
      HAS_PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      # These values are consumed by Babel while Metro creates the release JS bundle.
      # Keep them at job scope so every transform worker receives the same config.
      # Public OAuth client ID shared with Android CI; override in GitHub secret/variable
      # after confirming parity with backend GOOGLE_CLIENT_ID for production.
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID || vars.GOOGLE_WEB_CLIENT_ID || '689098029576-r7hoijre01nvocb25elp2q0ufb5v0geu.apps.googleusercontent.com' }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      NEXA_MAPTILER_API_KEY: ${{ secrets.NEXA_MAPTILER_API_KEY }}
      NEXA_MAPTILER_MAP_ID: ${{ vars.NEXA_MAPTILER_MAP_ID || 'streets-v4' }}
      NEXA_MAPTILER_REGION: ${{ vars.NEXA_MAPTILER_REGION || 'eu' }}
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: pnpm/action-setup@5eea8caf49c844361c1e9ddc1324e179c54b58e9 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Guard production legal URLs
        env:
          NEXA_PLAY_TRACK: ${{ inputs.track || 'alpha' }}
        run: node scripts/check-production-legal-urls.mjs

      - name: Guard required release secrets
        env:
          GOOGLE_MAPS_API_KEY_RELEASE: ${{ secrets.GOOGLE_MAPS_API_KEY_RELEASE }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          missing=0
          for name in \
            GOOGLE_WEB_CLIENT_ID \
            SENTRY_DSN \
            NEXA_MAPTILER_API_KEY \
            GOOGLE_MAPS_API_KEY_RELEASE \
            GOOGLE_SERVICES_JSON \
            ANDROID_UPLOAD_KEYSTORE_BASE64 \
            ANDROID_UPLOAD_STORE_PASSWORD \
            ANDROID_UPLOAD_KEY_ALIAS \
            ANDROID_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required release secret $name is missing"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Guard MapLibre release config
        run: node scripts/check-maplibre-release-config.mjs

      - name: Inject Maps keys
        env:
          GOOGLE_MAPS_API_KEY_DEBUG: ${{ secrets.GOOGLE_MAPS_API_KEY_DEBUG }}
          GOOGLE_MAPS_API_KEY_RELEASE: ${{ secrets.GOOGLE_MAPS_API_KEY_RELEASE }}
        run: |
          cat >> android/local.properties <<EOF
          GOOGLE_MAPS_API_KEY_DEBUG=${GOOGLE_MAPS_API_KEY_DEBUG}
          GOOGLE_MAPS_API_KEY_RELEASE=${GOOGLE_MAPS_API_KEY_RELEASE}
          EOF

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json

      - name: Decode upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 -d > android/app/upload.keystore

      - name: Inject release signing config
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          cat >> android/local.properties <<EOF
          RELEASE_STORE_FILE=app/upload.keystore
          RELEASE_STORE_PASSWORD=${ANDROID_UPLOAD_STORE_PASSWORD}
          RELEASE_KEY_ALIAS=${ANDROID_UPLOAD_KEY_ALIAS}
          RELEASE_KEY_PASSWORD=${ANDROID_UPLOAD_KEY_PASSWORD}
          EOF

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Resolve and validate version code
        env:
          REQUESTED_VERSION_CODE: ${{ inputs.version_code || '' }}
          FALLBACK_VERSION_CODE: ${{ github.run_number }}
        run: |
          VERSION_CODE="${REQUESTED_VERSION_CODE:-$FALLBACK_VERSION_CODE}"
          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || [ "${#VERSION_CODE}" -gt 10 ] || [ "$VERSION_CODE" -gt 2100000000 ]; then
            echo "::error::Invalid Android versionCode"
            exit 1
          fi
          echo "ANDROID_RELEASE_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "::notice::Building Android versionCode $VERSION_CODE; verify it exceeds all Play Console uploads."

      - name: Build signed release AAB
        env:
          SENTRY_RELEASE: com.g88@1.0.1+${{ env.ANDROID_RELEASE_VERSION_CODE }}
          SENTRY_DIST: ${{ env.ANDROID_RELEASE_VERSION_CODE }}
        run: |
          cd android
          ATTEMPTS=5
          for i in $(seq 1 "$ATTEMPTS"); do
            if ./gradlew bundleRelease --no-daemon \
              --init-script ci-init.gradle \
              -PversionCodeOverride=${ANDROID_RELEASE_VERSION_CODE}; then
              exit 0
            fi
            if [ "$i" -eq "$ATTEMPTS" ]; then
              echo "::error::bundleRelease failed after $ATTEMPTS attempts"
              exit 1
            fi
            sleep_s=$((i * 45))
            echo "::warning::Gradle failed (attempt $i/$ATTEMPTS) — sleeping ${sleep_s}s (Maven 429 is common on GHA)"
            sleep "$sleep_s"
          done

      - name: Verify the AAB is signed with a non-debug certificate
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "::error::AAB not produced"; exit 1; }

          # A missing signer must be an error, not a successful "not debug-signed" check.
          # Android App Bundles use JAR signing, which jarsigner can verify.
          SIGNATURE_OUTPUT="$(jarsigner -verify "$AAB" 2>&1)" || {
            echo "::error::AAB signature verification failed."
            exit 1
          }
          if ! grep -Fq 'jar verified.' <<< "$SIGNATURE_OUTPUT"; then
            echo "::error::AAB has no verifiable JAR signature."
            exit 1
          fi

          CERT_INFO="$(keytool -printcert -jarfile "$AAB" 2>&1)" || {
            echo "::error::Could not read AAB signing certificate."
            exit 1
          }
          if ! grep -q '^Owner:' <<< "$CERT_INFO"; then
            echo "::error::AAB signing certificate metadata missing."
            exit 1
          fi
          if grep -qi 'Android Debug' <<< "$CERT_INFO"; then
            echo "::error::AAB uses an Android Debug certificate, not the upload key."
            exit 1
          fi
          echo "::notice::AAB JAR signature verified with a non-debug certificate. Confirm its SHA-256 against the Play Console upload certificate before upload."

      - name: Upload AAB artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: g88-release-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      # Never upload solely because a v* tag was pushed, even if Play credentials exist.
      # Publishing requires a manual workflow_dispatch with publish=true AND a
      # configured Play service account. Tag pushes always remain build-only.
      # The first upload on a new app/track may still need to be performed in Console.
      - name: Publish to Google Play
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.publish == true &&
          env.HAS_PLAY_SA == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.g88
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'alpha' }}
          status: ${{ inputs.status || 'completed' }}
          whatsNewDirectory: apps/mobile/distribution/whatsnew

      - name: Note when publish was skipped
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.publish != true ||
          env.HAS_PLAY_SA != 'true'
        run: echo "::notice::Build-only AAB; Play upload skipped. Explicit manual publish=true plus PLAY_SERVICE_ACCOUNT_JSON are required. The first Play upload can be completed manually in the Console."
