name: Android Release (AAB)

# Builds signed AABs on manual dispatch and v* tags. Tag pushes NEVER upload to
# Google Play. Only a manually dispatched workflow on master with publish=true
# may upload to the allowlisted INTERNAL or ALPHA test track. Production is
# deliberately unsupported in this workflow.
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Testing track ONLY (production is not available)"
        required: true
        type: choice
        options:
          - internal
          - alpha
        default: internal
      publish:
        description: "Manually upload signed AAB to the selected testing track (false = build only)"
        type: boolean
        required: false
        default: false
      status:
        description: "Release status on the track"
        type: choice
        required: false
        default: "completed"
        options: ["completed", "draft"]
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Signed AAB
    runs-on: ubuntu-latest
    env:
      # These values are consumed by Babel while Metro creates the release JS bundle.
      # Keep them at job scope so every transform worker receives the same config.
      # Public OAuth client ID shared with Android CI; override in GitHub secret/variable
      # after confirming parity with backend GOOGLE_CLIENT_ID for production.
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID || vars.GOOGLE_WEB_CLIENT_ID || '689098029576-r7hoijre01nvocb25elp2q0ufb5v0geu.apps.googleusercontent.com' }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      NEXA_MAPTILER_API_KEY: ${{ secrets.NEXA_MAPTILER_API_KEY }}
      NEXA_MAPTILER_MAP_ID: ${{ vars.NEXA_MAPTILER_MAP_ID || 'streets-v4' }}
      NEXA_MAPTILER_REGION: ${{ vars.NEXA_MAPTILER_REGION || 'eu' }}
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Guard production legal URLs
        env:
          NEXA_PLAY_TRACK: ${{ inputs.track || 'alpha' }}
        run: node scripts/check-production-legal-urls.mjs

      - name: Guard required release secrets
        env:
          GOOGLE_MAPS_API_KEY_RELEASE: ${{ secrets.GOOGLE_MAPS_API_KEY_RELEASE }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          missing=0
          for name in \
            GOOGLE_WEB_CLIENT_ID \
            SENTRY_DSN \
            NEXA_MAPTILER_API_KEY \
            GOOGLE_MAPS_API_KEY_RELEASE \
            GOOGLE_SERVICES_JSON \
            ANDROID_UPLOAD_KEYSTORE_BASE64 \
            ANDROID_UPLOAD_STORE_PASSWORD \
            ANDROID_UPLOAD_KEY_ALIAS \
            ANDROID_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required release secret $name is missing"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Guard MapLibre release config
        run: node scripts/check-maplibre-release-config.mjs

      - name: Inject Maps keys
        env:
          GOOGLE_MAPS_API_KEY_DEBUG: ${{ secrets.GOOGLE_MAPS_API_KEY_DEBUG }}
          GOOGLE_MAPS_API_KEY_RELEASE: ${{ secrets.GOOGLE_MAPS_API_KEY_RELEASE }}
        run: |
          cat >> android/local.properties <<EOF
          GOOGLE_MAPS_API_KEY_DEBUG=${GOOGLE_MAPS_API_KEY_DEBUG}
          GOOGLE_MAPS_API_KEY_RELEASE=${GOOGLE_MAPS_API_KEY_RELEASE}
          EOF

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json

      - name: Decode upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 -d > android/app/upload.keystore

      - name: Inject release signing config
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          cat >> android/local.properties <<EOF
          RELEASE_STORE_FILE=app/upload.keystore
          RELEASE_STORE_PASSWORD=${ANDROID_UPLOAD_STORE_PASSWORD}
          RELEASE_KEY_ALIAS=${ANDROID_UPLOAD_KEY_ALIAS}
          RELEASE_KEY_PASSWORD=${ANDROID_UPLOAD_KEY_PASSWORD}
          EOF

      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build signed release AAB
        env:
          SENTRY_RELEASE: com.g88@1.0.0+${{ github.run_number }}
          SENTRY_DIST: ${{ github.run_number }}
        run: |
          cd android
          ATTEMPTS=5
          for i in $(seq 1 "$ATTEMPTS"); do
            if ./gradlew bundleRelease --no-daemon \
              --init-script ci-init.gradle \
              -PversionCodeOverride=${{ github.run_number }}; then
              exit 0
            fi
            if [ "$i" -eq "$ATTEMPTS" ]; then
              echo "::error::bundleRelease failed after $ATTEMPTS attempts"
              exit 1
            fi
            sleep_s=$((i * 45))
            echo "::warning::Gradle failed (attempt $i/$ATTEMPTS) — sleeping ${sleep_s}s (Maven 429 is common on GHA)"
            sleep "$sleep_s"
          done

      - name: Verify the AAB is not debug-signed
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "::error::AAB not produced"; exit 1; }
          # Fail loudly if the bundle is still signed with the Android debug key.
          if unzip -p "$AAB" META-INF/*.RSA 2>/dev/null | keytool -printcert 2>/dev/null | grep -q "Android Debug"; then
            echo "::error::AAB is debug-signed — upload keystore secrets are missing or misconfigured."
            exit 1
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: g88-release-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Report build-only completion
        run: echo "::notice::AAB uploaded as a workflow artifact. Tag pushes never publish to Google Play."

  publish_test:
    name: Upload to Google Play testing (manual only)
    needs: release
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master' &&
      inputs.publish == true &&
      (inputs.track == 'internal' || inputs.track == 'alpha')
    runs-on: ubuntu-latest
    environment: play-testing
    concurrency:
      group: nexus-play-console-com-g88
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download signed AAB from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: g88-release-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/

      - name: Check artifact and API credentials
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -s apps/mobile/android/app/build/outputs/bundle/release/app-release.aab || {
            echo "::error::The signed AAB artifact is missing"; exit 1;
          }
          test -n "$PLAY_SERVICE_ACCOUNT_JSON" || {
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not configured"; exit 1;
          }
          sha256sum apps/mobile/android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB to testing only
        uses: r0adkll/upload-google-play@eb49699984a39f23558439581660aa6f088acfd6 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.g88
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          whatsNewDirectory: apps/mobile/distribution/whatsnew
