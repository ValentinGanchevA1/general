name: Web Preview CI

on:
  pull_request:
    paths:
      - 'web/**'
      - 'packages/shared/**'
      - '.github/workflows/web-preview.yml'
  push:
    branches:
      - master
    paths:
      - 'web/**'
      - 'packages/shared/**'
      - '.github/workflows/web-preview.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  web-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Typecheck web preview
        run: pnpm exec tsc -p web/tsconfig.json

      - name: Build web preview
        run: node web/build.mjs

      - name: Verify browser bundle
        run: |
          test -s web/dist/app.js
          node --check web/dist/app.js
