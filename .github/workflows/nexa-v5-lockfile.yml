name: NEXA v5 lockfile

on:
  push:
    branches: ["feat/nexa-radiant-eye-v5"]
    paths:
      - 'apps/mobile/package.json'
      - '.github/workflows/nexa-v5-lockfile.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "pnpm-lock.yaml already up to date"
            exit 0
          fi
          git commit -m "chore: update pnpm lockfile for NEXA v5"
          git push origin HEAD:feat/nexa-radiant-eye-v5
