name: Temporary Web Lockfile Sync

on:
  push:
    branches:
      - feat/nexa-web-maplibre-runtime

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile-sync]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/nexa-web-maplibre-runtime
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Generate web importer lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --filter @g88/web

      - name: Commit generated lockfile once
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore(deps): sync web MapLibre lockfile [lockfile-sync]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
