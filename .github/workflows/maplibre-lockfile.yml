name: Generate MapLibre lockfile

on:
  push:
    branches:
      - feat/maplibre-native-dependency
    paths:
      - apps/mobile/package.json
      - .github/workflows/maplibre-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/maplibre-native-dependency
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.13.1
          cache: pnpm
      - name: Generate lockfile from workspace manifests
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Verify only lockfile changed
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain | awk '$2 != "pnpm-lock.yaml" {print}')"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated changes:"
            echo "$unexpected"
            exit 1
          fi
          git diff --check
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build(mobile): generate MapLibre lockfile"
          git push origin HEAD:feat/maplibre-native-dependency
