name: Android APK (sideload)

# Builds a signed release **APK** for direct sharing / sideloading (not the Play
# Store — that's android-release.yml's AAB). The APK is signed with the same
# upload keystore as the AAB, so it has a stable signing identity: updates built
# here install over previous ones, and you whitelist a single SHA-1 on the Maps
# key.
#
# IMPORTANT (blank-map gotcha): a sideloaded APK keeps the *upload key's*
# signature (unlike a Play-distributed build, which Google re-signs with the App
# Signing key). So the SHA-1 that must be added to GOOGLE_MAPS_API_KEY_RELEASE's
# Android app restriction is the **upload key's** SHA-1 — printed by the
# "Print signing certificate fingerprints" step below — NOT the Play App Signing
# SHA-1. Add it once in Google Cloud Console → Credentials → the release Maps key.
#
# Trigger: manual via the Actions tab (once this file is on the default branch),
# or by pushing the ci/android-apk branch.
on:
  workflow_dispatch:
  push:
    branches:
      - ci/android-apk

permissions:
  contents: write   # create/update the GitHub Release that hosts the shareable APK

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  apk:
    name: Signed APK
    runs-on: ubuntu-latest
    # Job-level permissions are required in addition to workflow-level:
    # some GitHub runners / org policies only honor the job scope for
    # contents:write when creating releases/tags.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Ensure Hermes compiler is available and runnable
        working-directory: .
        run: |
          # Force a clean reinstall to ensure the hermes-compiler binary is
          # properly extracted (guards against a stale/corrupted pnpm store
          # on the runner). Do NOT `pnpm install hermes-compiler --force` --
          # that's a workspace-root dependency add and pnpm blocks it
          # (ERR_PNPM_ADDING_TO_ROOT) unless -w is passed, which would
          # incorrectly add it to root package.json.
          pnpm store prune
          rm -rf node_modules
          pnpm install --frozen-lockfile

          # Only libz3-4 is confirmed required (Hermes links against Z3 for
          # its SMT-based type checking). Don't add speculative packages here
          # — an unavailable apt package on a future runner image would hard
          # -fail this step for no real benefit.
          sudo apt-get update
          sudo apt-get install -y libz3-4

          # Do NOT `find -name hermesc | head -1` — hermes-compiler ships a
          # same-named "hermesc" binary under every platform folder
          # (osx-arm64, win64-bin, etc.). On Linux runners that resolves to a
          # non-Linux binary and the subsequent --version check fails with
          # "cannot execute binary file". Pin the Linux path explicitly.
          HERMESC="node_modules/hermes-compiler/hermesc/linux64-bin/hermesc"
          test -x "$HERMESC" || {
            echo "::error::hermesc not found at $HERMESC after clean install"
            find node_modules -name hermesc -type f 2>/dev/null | head -20 || true
            exit 1
          }
          "$HERMESC" --version

      - name: Inject Maps keys
        env:
          GOOGLE_MAPS_API_KEY_DEBUG: ${{ secrets.GOOGLE_MAPS_API_KEY_DEBUG }}
          GOOGLE_MAPS_API_KEY_RELEASE: ${{ secrets.GOOGLE_MAPS_API_KEY_RELEASE }}
        run: |
          # Prefer dedicated debug/release secrets; fall back to single key if only one is set.
          DEBUG_KEY="${GOOGLE_MAPS_API_KEY_DEBUG:-${GOOGLE_MAPS_API_KEY_RELEASE:-}}"
          RELEASE_KEY="${GOOGLE_MAPS_API_KEY_RELEASE:-${GOOGLE_MAPS_API_KEY_DEBUG:-}}"
          if [ -z "$DEBUG_KEY" ] || [ -z "$RELEASE_KEY" ]; then
            echo "::warning::Maps API keys missing — map tiles will be blank on device."
          fi
          # android/local.properties is gitignored; Gradle reads it for MAPS_*_KEY.
          cat > android/local.properties <<EOF
MAPS_DEBUG_KEY=$DEBUG_KEY
MAPS_RELEASE_KEY=$RELEASE_KEY
EOF

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON secret missing — Firebase/FCM will not work in this APK."
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is required for a signed release APK."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Inject release signing config
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            eval "val=\$$v"
            if [ -z "$val" ]; then
              echo "::error::$v secret is required for release signing."
              exit 1
            fi
          done
          # gradle.properties is already present; append signing props (not committed).
          cat >> android/gradle.properties <<EOF

MYAPP_UPLOAD_STORE_FILE=upload-keystore.jks
MYAPP_UPLOAD_KEY_ALIAS=$ANDROID_KEY_ALIAS
MYAPP_UPLOAD_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
MYAPP_UPLOAD_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
EOF

      - name: Print signing certificate fingerprints
        run: |
          # Operators need the upload-key SHA-1 for Maps API key restrictions.
          keytool -list -v \
            -keystore android/app/upload-keystore.jks \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" 2>/dev/null \
            | grep -E 'SHA1:|SHA256:|Owner:|Alias name:' || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/mobile/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build signed release APK
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          cd android
          # Maven Central rate-limits GHA (HTTP 429). Mirror + init-script reduce
          # hits; outer retry absorbs residual transient failures.
          ATTEMPTS=5
          for i in $(seq 1 "$ATTEMPTS"); do
            if ./gradlew assembleRelease --no-daemon \
              --init-script ci-init.gradle \
              -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
              -PreactNativeDevServerPort=8081; then
              exit 0
            fi
            if [ "$i" -eq "$ATTEMPTS" ]; then
              echo "::error::Gradle assembleRelease failed after $ATTEMPTS attempts"
              exit 1
            fi
            sleep_s=$((i * 45))
            echo "::warning::Gradle failed (attempt $i/$ATTEMPTS) — sleeping ${sleep_s}s (Maven 429 is common on GHA)"
            sleep "$sleep_s"
          done

      - name: Verify the APK is not debug-signed
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::APK not produced"; exit 1; }
          # Fail loudly if the APK is still signed with the Android debug key
          # (would mean the upload keystore secrets are missing/misconfigured).
          if unzip -p "$APK" META-INF/*.RSA 2>/dev/null | keytool -printcert 2>/dev/null | grep -q "Android Debug"; then
            echo "::error::APK is debug-signed — upload keystore secrets are missing or misconfigured."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: g88-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      # Give the APK a stable, human-friendly filename so the
      # releases/latest/download/g88-v1.0.apk link is permanent.
      - name: Stage APK for release
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/g88-v1.0.apk

      # Publishes a GitHub Release per run with the signed APK attached. The
      # per-run tag (apk-v1.0.<run_number>) is immutable history; make_latest
      # keeps releases/latest/download/g88-v1.0.apk pointing at the newest build,
      # so the share link never changes. Full release (not prerelease) is
      # required for the /latest/ redirect to resolve.
      # Requires contents:write (workflow + job). If this still fails with
      # "Resource not accessible by integration", set repo Settings → Actions
      # → General → Workflow permissions → Read and write permissions.
      # Optional override: create a classic PAT (repo scope) as secret
      # RELEASE_GITHUB_TOKEN when the default GITHUB_TOKEN is restricted by org policy.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: apk-v1.0.${{ github.run_number }}
          name: "G88 v1.0 (build ${{ github.run_number }}) — Android sideload APK"
          files: apps/mobile/android/app/build/outputs/apk/release/g88-v1.0.apk
          make_latest: "true"
          fail_on_unmatched_files: true
          target_commitish: ${{ github.sha }}
          body: |
            Signed Android APK for direct install (sideload). Not the Play Store build.

            **Permanent download link** (always the newest build):
            https://github.com/${{ github.repository }}/releases/latest/download/g88-v1.0.apk

            ## Install
            1. On Android, allow installing from your browser/file manager (Settings → Apps → Special access → Install unknown apps).
            2. Download **g88-v1.0.apk** below and tap it to install.
            3. Or via ADB: `adb install g88-v1.0.apk`

            ## Notes
            - Signed with the G88 upload key (stable identity — builds install over each other).
            - Connects to the production backend (`api.g88.app`).
            - If the map is blank, the app's upload-key SHA-1 still needs whitelisting on the release Maps key.

            Commit: ${{ github.sha }} · Build: ${{ github.run_number }}
