name: Refresh Realtime Redis Lockfile

on:
  push:
    branches:
      - fix/realtime-redis-adapter
    paths:
      - .github/workflows/refresh-realtime-redis-lock.yml
      - apps/backend/package.json

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/realtime-redis-adapter
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Refresh lockfile from workspace manifests
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated lockfile only
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already matches package manifests"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "build(realtime): refresh pnpm lockfile"
          git fetch origin fix/realtime-redis-adapter
          git rebase origin/fix/realtime-redis-adapter
          git push origin HEAD:fix/realtime-redis-adapter
