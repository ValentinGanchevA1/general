name: Android Two-Device Realtime Privacy E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - "apps/mobile/src/config.ts"
      - "apps/mobile/src/features/chat/**"
      - "apps/mobile/src/realtime/**"
      - "apps/mobile/src/screens/ChatScreen.tsx"
      - "apps/mobile/src/screens/UserProfileScreen.tsx"
      - "scripts/android-two-device-privacy-setup.mjs"
      - "scripts/android-two-device-privacy-e2e.sh"
      - "scripts/android-two-device-ui.py"
      - ".github/workflows/android-two-device-privacy-e2e.yml"

permissions:
  contents: read

concurrency:
  group: android-two-device-realtime-privacy-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEVICE_E2E_STATE_FILE: .tmp/android-two-device-privacy.json
  DEVICE_E2E_BASE_URL: https://g88-api.onrender.com
  ANDROID_AVD_HOME: ${{ github.workspace }}/.tmp/android-avd

jobs:
  android-two-device-privacy:
    name: live location block + reconnect on two AVDs
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Make Hermes compiler executable
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libz3-4
          CANDIDATES=$(find node_modules -type f -name "hermesc" 2>/dev/null || true)
          test -n "$CANDIDATES" || { echo "::error::No hermesc binary found"; exit 1; }
          while IFS= read -r candidate; do
            [ -z "$candidate" ] && continue
            if file "$candidate" | grep -q "ELF"; then
              chmod +x "$candidate"
            fi
          done <<< "$CANDIDATES"

      - name: Inject Android build configuration
        working-directory: apps/mobile
        env:
          GOOGLE_MAPS_API_KEY_DEBUG: ${{ secrets.GOOGLE_MAPS_API_KEY_DEBUG }}
          GOOGLE_MAPS_API_KEY_RELEASE: ${{ secrets.GOOGLE_MAPS_API_KEY_RELEASE }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          cat >> android/local.properties <<EOF
          GOOGLE_MAPS_API_KEY_DEBUG=${GOOGLE_MAPS_API_KEY_DEBUG}
          GOOGLE_MAPS_API_KEY_RELEASE=${GOOGLE_MAPS_API_KEY_RELEASE}
          EOF
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          else
            cat > android/app/google-services.json <<'JSON'
          {
            "project_info": { "project_number": "0", "project_id": "g88-ci-placeholder" },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:0:android:0",
                "android_client_info": { "package_name": "com.g88" }
              },
              "api_key": [{ "current_key": "placeholder" }]
            }]
          }
          JSON
          fi

      - name: Build probe-enabled x86_64 release APK
        working-directory: apps/mobile/android
        env:
          GOOGLE_WEB_CLIENT_ID: 689098029576-r7hoijre01nvocb25elp2q0ufb5v0geu.apps.googleusercontent.com
          NEXA_E2E_DEVICE_PROBE: '1'
          SENTRY_DSN: ''
        run: |
          ./gradlew assembleRelease --no-daemon \
            --init-script ci-init.gradle \
            -PversionCodeOverride=${{ github.run_number }} \
            -PreactNativeArchitectures=x86_64
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          unzip -Z1 "$APK" | grep -q '^lib/x86_64/.*\.so$'

      - name: Provision isolated production test accounts
        run: node scripts/android-two-device-privacy-setup.mjs prepare

      - name: Install Android 12 emulator image
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          test -x "$SDKMANAGER" || {
            echo "::error::sdkmanager not found under ANDROID_HOME=$ANDROID_HOME"
            find "$ANDROID_HOME" -maxdepth 4 -type f \( -name sdkmanager -o -name avdmanager \) -print 2>/dev/null || true
            exit 1
          }

          AVDMANAGER="$(dirname "$SDKMANAGER")/avdmanager"
          test -x "$AVDMANAGER" || {
            echo "::error::avdmanager not found next to sdkmanager"
            exit 1
          }

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-31;google_apis;x86_64"

          ADB="$ANDROID_HOME/platform-tools/adb"
          test -x "$ADB" || {
            echo "::error::adb not found at $ADB after installing platform-tools"
            exit 1
          }
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$AVDMANAGER" create avd --force --name nexa-a --package "system-images;android-31;google_apis;x86_64" --device pixel_4
          echo no | "$AVDMANAGER" create avd --force --name nexa-b --package "system-images;android-31;google_apis;x86_64" --device pixel_4

          AVDS="$("$ANDROID_HOME/emulator/emulator" -list-avds)"
          printf '%s\n' "$AVDS"
          grep -qx 'nexa-a' <<< "$AVDS" || { echo "::error::nexa-a is not visible to emulator"; exit 1; }
          grep -qx 'nexa-b' <<< "$AVDS" || { echo "::error::nexa-b is not visible to emulator"; exit 1; }
          sudo chmod 666 /dev/kvm || true

      - name: Boot two Android emulators
        run: |
          mkdir -p .tmp/emulators
          nohup "$ANDROID_HOME/emulator/emulator" -avd nexa-a -port 5554 \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect -memory 2048 -cores 2 \
            >.tmp/emulators/a.log 2>&1 &
          nohup "$ANDROID_HOME/emulator/emulator" -avd nexa-b -port 5556 \
            -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            -gpu swiftshader_indirect -memory 2048 -cores 2 \
            >.tmp/emulators/b.log 2>&1 &

          for serial in emulator-5554 emulator-5556; do
            if ! timeout 120s adb -s "$serial" wait-for-device; then
              echo "::error::$serial was not discovered by adb within 120s"
              adb devices -l || true
              if [ "$serial" = "emulator-5554" ]; then
                echo "--- nexa-a emulator log ---"
                tail -n 200 .tmp/emulators/a.log || true
              else
                echo "--- nexa-b emulator log ---"
                tail -n 200 .tmp/emulators/b.log || true
              fi
              exit 1
            fi

            deadline=$((SECONDS + 180))
            while [ "$(adb -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != "1" ]; do
              if (( SECONDS >= deadline )); then
                echo "::error::$serial did not boot within 180s after adb discovery"
                adb devices -l || true
                if [ "$serial" = "emulator-5554" ]; then
                  echo "--- nexa-a emulator log ---"
                  tail -n 200 .tmp/emulators/a.log || true
                else
                  echo "--- nexa-b emulator log ---"
                  tail -n 200 .tmp/emulators/b.log || true
                fi
                exit 1
              fi
              sleep 2
            done
            adb -s "$serial" shell settings put global window_animation_scale 0
            adb -s "$serial" shell settings put global transition_animation_scale 0
            adb -s "$serial" shell settings put global animator_duration_scale 0
          done
          adb devices -l

      - name: Run two-device privacy regression
        env:
          DEVICE_E2E_APK_PATH: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
        run: bash scripts/android-two-device-privacy-e2e.sh

      - name: Capture emulator evidence on failure
        if: failure()
        run: |
          mkdir -p .tmp/device-evidence
          cp .tmp/emulators/*.log .tmp/device-evidence/ 2>/dev/null || true
          adb devices -l > .tmp/device-evidence/adb-devices.txt 2>&1 || true
          for serial in emulator-5554 emulator-5556; do
            timeout 10s adb -s "$serial" exec-out screencap -p \
              > ".tmp/device-evidence/${serial}.png" 2>/dev/null || true
            timeout 10s adb -s "$serial" logcat -d 2>/dev/null \
              | grep -E 'NEXA_E2E_DEVICE|AndroidRuntime' \
              > ".tmp/device-evidence/${serial}.log" || true
          done

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-two-device-privacy-evidence
          path: .tmp/device-evidence
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup synthetic accounts
        if: always()
        run: |
          if [ -f "$DEVICE_E2E_STATE_FILE" ]; then
            node scripts/android-two-device-privacy-setup.mjs cleanup || true
          fi
