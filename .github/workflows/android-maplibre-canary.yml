name: Android MapLibre Canary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-maplibre-canary
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ENTRY_FILE: maplibre-smoke.js
  NEXA_MAP_RENDERER: maplibre
  NEXA_MAPLIBRE_SMOKE_STYLE: provider
  NEXA_MAPTILER_API_KEY: ${{ secrets.NEXA_MAPTILER_API_KEY }}
  NEXA_MAPTILER_MAP_ID: ${{ vars.NEXA_MAPTILER_MAP_ID || 'streets-v4' }}
  NEXA_MAPTILER_REGION: ${{ vars.NEXA_MAPTILER_REGION || 'eu' }}

jobs:
  android-maplibre-canary:
    name: Android MapLibre provider canary APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Install Android canary host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils libz3-4 unzip

      - name: Ensure Hermes hermesc is executable
        working-directory: .
        run: |
          CANDIDATES=$(find node_modules -type f -name "hermesc" 2>/dev/null || true)
          if [ -z "$CANDIDATES" ]; then
            echo "::error::No hermesc binary found under node_modules"
            exit 1
          fi

          ELF_COUNT=0
          while IFS= read -r candidate; do
            [ -z "$candidate" ] && continue
            if file "$candidate" | grep -q "ELF"; then
              chmod +x "$candidate"
              ELF_COUNT=$((ELF_COUNT + 1))
              "$candidate" -version >/dev/null || {
                echo "::error::$candidate is not runnable"
                exit 1
              }
            fi
          done <<< "$CANDIDATES"

          if [ "$ELF_COUNT" -eq 0 ]; then
            echo "::error::No ELF hermesc found on this runner"
            exit 1
          fi

          echo "hermesc ready ($ELF_COUNT ELF binary/ies)"

      - name: Validate real MapTiler client config
        run: node scripts/check-maplibre-release-config.mjs

      - name: Inject Maps keys
        env:
          GOOGLE_MAPS_API_KEY_DEBUG: ${{ secrets.GOOGLE_MAPS_API_KEY_DEBUG }}
          GOOGLE_MAPS_API_KEY_RELEASE: ${{ secrets.GOOGLE_MAPS_API_KEY_RELEASE }}
        run: |
          cat >> android/local.properties <<EOF
          GOOGLE_MAPS_API_KEY_DEBUG=${GOOGLE_MAPS_API_KEY_DEBUG}
          GOOGLE_MAPS_API_KEY_RELEASE=${GOOGLE_MAPS_API_KEY_RELEASE}
          EOF

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::notice::GOOGLE_SERVICES_JSON is empty; using CI placeholder for the isolated smoke APK."
            cat > android/app/google-services.json <<'JSON'
          {
            "project_info": { "project_number": "0", "project_id": "g88-ci-placeholder" },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:0:android:0",
                "android_client_info": { "package_name": "com.g88" }
              },
              "api_key": [{ "current_key": "placeholder" }]
            }]
          }
          JSON
          else
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          fi

      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build MapLibre provider canary APK
        env:
          GOOGLE_WEB_CLIENT_ID: 689098029576-r7hoijre01nvocb25elp2q0ufb5v0geu.apps.googleusercontent.com
        shell: bash
        run: |
          set -euo pipefail

          test "$ENTRY_FILE" = "maplibre-smoke.js"
          test "$NEXA_MAP_RENDERER" = "maplibre"
          test "$NEXA_MAPLIBRE_SMOKE_STYLE" = "provider"

          cd android
          ATTEMPTS=5
          for i in $(seq 1 "$ATTEMPTS"); do
            if ./gradlew assembleRelease --no-daemon \
              --init-script ci-init.gradle \
              -PversionCodeOverride=${{ github.run_number }}; then
              exit 0
            fi

            if [ "$i" -eq "$ATTEMPTS" ]; then
              echo "::error::assembleRelease failed after $ATTEMPTS attempts"
              exit 1
            fi

            sleep_s=$((i * 45))
            echo "::warning::Gradle failed (attempt $i/$ATTEMPTS); sleeping ${sleep_s}s before retry."
            sleep "$sleep_s"
          done

      - name: Verify canary APK bundle contract
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"
          BUNDLE="${RUNNER_TEMP}/nexa-maplibre-canary.bundle"

          test -f "$APK" || {
            echo "::error::Canary APK not produced at $APK"
            exit 1
          }

          if ! unzip -l "$APK" | grep -q "assets/index.android.bundle"; then
            echo "::error::Canary APK is missing assets/index.android.bundle"
            exit 1
          fi

          unzip -p "$APK" assets/index.android.bundle > "$BUNDLE"
          if ! strings "$BUNDLE" | grep -Fq "maplibre-smoke-ready"; then
            echo "::error::Embedded Hermes bundle does not contain the MapLibre smoke marker; ENTRY_FILE may not have been honored."
            exit 1
          fi

          echo "MapLibre smoke entry marker verified in embedded Android bundle."
          ls -lh "$APK"

      - name: Upload MapLibre canary APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nexa-maplibre-canary-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Record canary contract
        if: always()
        shell: bash
        run: |
          {
            echo '## MapLibre Android provider-canary APK'
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Map ID: \`${NEXA_MAPTILER_MAP_ID}\`"
            echo "- Region: \`${NEXA_MAPTILER_REGION}\`"
            echo '- Renderer request: `maplibre`'
            echo '- JS entry: `maplibre-smoke.js`'
            echo '- Style source: real MapTiler provider URL'
            echo '- Production default changed: no'
            echo '- Physical-device interaction smoke: still required after artifact build'
          } >> "$GITHUB_STEP_SUMMARY"
