name: Android Build

on:
  push:
    branches: [master, "claude/**"]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches: [master]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Inject Maps keys
        env:
          GOOGLE_MAPS_API_KEY_DEBUG: ${{ secrets.GOOGLE_MAPS_API_KEY_DEBUG }}
          GOOGLE_MAPS_API_KEY_RELEASE: ${{ secrets.GOOGLE_MAPS_API_KEY_RELEASE }}
        run: |
          cat >> android/local.properties <<EOF
          GOOGLE_MAPS_API_KEY_DEBUG=${GOOGLE_MAPS_API_KEY_DEBUG}
          GOOGLE_MAPS_API_KEY_RELEASE=${GOOGLE_MAPS_API_KEY_RELEASE}
          EOF

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json

      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build debug APK
        run: |
          cd android
          ATTEMPTS=5
          for i in $(seq 1 "$ATTEMPTS"); do
            if ./gradlew assembleDebug --no-daemon --init-script ci-init.gradle; then
              exit 0
            fi
            if [ "$i" -eq "$ATTEMPTS" ]; then
              echo "::error::assembleDebug failed after $ATTEMPTS attempts"
              exit 1
            fi
            sleep_s=$((i * 45))
            echo "::warning::Gradle failed (attempt $i/$ATTEMPTS) — sleeping ${sleep_s}s (Maven 429 is common on GHA)"
            sleep "$sleep_s"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
