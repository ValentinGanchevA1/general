name: Temporary Map Lifecycle Patch

on:
  push:
    branches:
      - fix/nexa-web-map-persistent-lifecycle

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch-app:
    if: ${{ !contains(github.event.head_commit.message, '[map-lifecycle-patch]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/nexa-web-map-persistent-lifecycle
          fetch-depth: 0

      - name: Preserve map DOM node across shell renders
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'web/src/app.ts';
          const source = fs.readFileSync(path, 'utf8');
          const before = `function render(): void {
            root.replaceChildren(safeFragment(shell()));
            bind();
          }`;
          const after = `function render(): void {
            const preservedMap = state.tab === 'map'
              ? root.querySelector<HTMLElement>('#nexa-map')
              : null;

            root.replaceChildren(safeFragment(shell()));

            if (preservedMap && state.tab === 'map') {
              const placeholder = root.querySelector<HTMLElement>('#nexa-map');
              if (placeholder && placeholder !== preservedMap) placeholder.replaceWith(preservedMap);
            }

            bind();
          }`;
          const matches = source.split(before).length - 1;
          if (matches !== 1) {
            throw new Error(`Expected exactly one render block, found ${matches}`);
          }
          fs.writeFileSync(path, source.replace(before, after));
          NODE

      - name: Commit patch once
        run: |
          git diff --check
          git diff --exit-code --quiet -- web/src/app.ts && {
            echo 'app.ts already patched'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/src/app.ts
          git commit -m 'fix(web): preserve map node across shell renders [map-lifecycle-patch]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
