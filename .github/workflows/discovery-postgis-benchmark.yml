# PostgreSQL/PostGIS Map Core performance baseline.
# PR and manual runs cover 10k / 50k / 100k on benchmark-related changes.
# Never targets a staging or production database.
name: Discovery PostGIS Benchmark

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'apps/backend/src/modules/discovery/discovery.benchmark.integration.spec.ts'
      - 'apps/backend/src/modules/discovery/discovery.union-benchmark.integration.spec.ts'
      - '.github/workflows/discovery-postgis-benchmark.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  postgis-benchmark:
    name: PostGIS discovery 10k+
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: nexa_bench
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: nexa_bench
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexa_bench -d nexa_bench"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DISCOVERY_BENCH_DATABASE_URL: postgresql://nexa_bench:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/nexa_bench
      DISCOVERY_BENCH_ACK_DISPOSABLE: 'YES'
      DISCOVERY_BENCH_REDIS_URL: redis://127.0.0.1:6379/15
      DISCOVERY_BENCH_ACK_REDIS: 'YES'
      DISCOVERY_BENCH_QUICK: 'NO'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@5eea8caf49c844361c1e9ddc1324e179c54b58e9 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared contracts
        run: pnpm --filter @g88/shared build
      - name: Run isolated PostGIS discovery queries and EXPLAIN ANALYZE
        run: >-
          pnpm --filter @g88/backend exec jest --ci --runInBand
          --runTestsByPath src/modules/discovery/discovery.benchmark.integration.spec.ts
          src/modules/discovery/discovery.union-benchmark.integration.spec.ts
          --verbose
