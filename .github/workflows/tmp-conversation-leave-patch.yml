name: Temporary Conversation Leave Patch

on:
  push:
    branches:
      - fix/nexa-conversation-final-leave

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch-conversation-leave:
    if: ${{ !contains(github.event.head_commit.message, '[conversation-leave-patch]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/nexa-conversation-final-leave
          fetch-depth: 0

      - name: Apply exact typed leave patches
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            const matches = source.split(before).length - 1;
            if (matches !== 1) throw new Error(`${path}: expected one patch target, found ${matches}`);
            fs.writeFileSync(path, source.replace(before, after));
          }

          replaceOnce(
            'packages/shared/src/events.ts',
            `  'conversation:join': (\n    p: { conversationId: string },\n    ack: (r: AckResult<{ joined: true }>) => void,\n  ) => void;\n  'chat:typing':`,
            `  'conversation:join': (\n    p: { conversationId: string },\n    ack: (r: AckResult<{ joined: true }>) => void,\n  ) => void;\n  'conversation:leave': (\n    p: { conversationId: string },\n    ack: (r: AckResult<{ left: true }>) => void,\n  ) => void;\n  'chat:typing':`,
          );

          replaceOnce(
            'apps/backend/src/realtime/realtime.dto.ts',
            `export class ConversationJoinDto {\n  @IsUUID() conversationId!: string;\n}\n\nexport class ChatSendDto`,
            `export class ConversationJoinDto {\n  @IsUUID() conversationId!: string;\n}\n\nexport class ConversationLeaveDto {\n  @IsUUID() conversationId!: string;\n}\n\nexport class ChatSendDto`,
          );

          replaceOnce(
            'apps/backend/src/realtime/realtime.gateway.ts',
            `  ChatSendDto,\n  ConversationJoinDto,\n  EventRoomDto,`,
            `  ChatSendDto,\n  ConversationJoinDto,\n  ConversationLeaveDto,\n  EventRoomDto,`,
          );

          replaceOnce(
            'apps/backend/src/realtime/realtime.gateway.ts',
            `  @SubscribeMessage('event:join')\n  @UsePipes(new ValidationPipe({ whitelist: true, transform: true }))`,
            `  @SubscribeMessage('conversation:leave')\n  @UseGuards(WsJwtGuard)\n  @UsePipes(new ValidationPipe({ whitelist: true, transform: true }))\n  async onConversationLeave(\n    @ConnectedSocket() client: G88Socket,\n    @MessageBody() payload: ConversationLeaveDto,\n  ): Promise<AckResult<{ left: true }>> {\n    const room = this.conversationRoom(payload.conversationId);\n    client.leave(room);\n    client.data.rooms.delete(room);\n    return { ok: true, data: { left: true } };\n  }\n\n  @SubscribeMessage('event:join')\n  @UsePipes(new ValidationPipe({ whitelist: true, transform: true }))`,
          );

          replaceOnce(
            'apps/mobile/src/realtime/useSocket.ts',
            `function socketJoinEvent(eventId: string): Promise<boolean> {`,
            `function socketLeaveConversation(conversationId: string): Promise<boolean> {\n  return new Promise((resolve) => {\n    const s = sharedSocket;\n    if (!s?.connected) return resolve(false);\n    const timer = setTimeout(() => resolve(false), 3_000);\n    s.emit('conversation:leave', { conversationId }, (res) => {\n      clearTimeout(timer);\n      resolve(res.ok);\n    });\n  });\n}\n\nfunction socketJoinEvent(eventId: string): Promise<boolean> {`,
          );

          replaceOnce(
            'apps/mobile/src/realtime/useSocket.ts',
            `      for (const conversationId of conversationIntents) {\n        roomRegistry.untrackConversation(conversationId);\n      }`,
            `      for (const conversationId of conversationIntents) {\n        const releasedFinal = roomRegistry.untrackConversation(conversationId);\n        if (releasedFinal) void socketLeaveConversation(conversationId);\n      }`,
          );
          NODE

      - name: Commit patch once
        run: |
          git diff --check
          git diff --exit-code --quiet -- packages/shared/src/events.ts apps/backend/src/realtime/realtime.dto.ts apps/backend/src/realtime/realtime.gateway.ts apps/mobile/src/realtime/useSocket.ts && {
            echo 'conversation leave patch already applied'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/shared/src/events.ts apps/backend/src/realtime/realtime.dto.ts apps/backend/src/realtime/realtime.gateway.ts apps/mobile/src/realtime/useSocket.ts
          git commit -m 'fix(realtime): leave conversation after final consumer [conversation-leave-patch]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
