name: Repair Realtime Mobile Client

on:
  push:
    branches:
      - fix/realtime-redis-adapter
    paths:
      - .github/workflows/repair-realtime-mobile-client.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/realtime-redis-adapter
          fetch-depth: 0
      - name: Restore master client and apply WS-only transport hunk
        run: |
          git fetch origin master
          git checkout origin/master -- apps/mobile/src/realtime/useSocket.ts
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/mobile/src/realtime/useSocket.ts')
          text = path.read_text()
          old = """          // Polling fallback when pure WS is blocked (strict mobile networks).\n          transports: ['websocket', 'polling'],"""
          new = """          // Render distributes WebSocket connections across replicas. Keep the\n          // transport WebSocket-only so a Socket.IO session never depends on\n          // load-balancer stickiness for HTTP long-polling requests.\n          transports: ['websocket'],"""
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one transport block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit exact client repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/realtime/useSocket.ts
          git commit -m "fix(realtime): preserve mobile socket lifecycle while using WS-only"
          git push origin HEAD:fix/realtime-redis-adapter
