# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [master, "claude/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  no-legacy-imports:
    name: No legacy imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Git for long paths
        run: git config --global core.longpaths true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Test secret scanning guard (regressions)
        run: node --test scripts/ci/check-no-secrets.test.mjs
      - name: Test G88 Supabase API ACL hardening script (static, no database writes)
        run: node --test scripts/ci/check-supabase-api-acl-hotfix.test.mjs
      - name: Test Play AAB manual publish and signature workflow guard
        run: node --test scripts/ci/check-play-release-workflow.test.mjs
      - name: Test disposable PostGIS credentials remain synchronized and localhost-only
        run: node --test scripts/ci/check-disposable-postgres-credentials.test.mjs
      - name: Secret / env scanning (hard gate)
        run: bash scripts/ci/check-no-secrets.sh
      - name: Test manual Terms legal publication gate (no files published)
        run: node --test scripts/legal/prepare-approved-terms.test.mjs
      - name: Check for forbidden legacy/ imports
        run: bash scripts/ci/check-no-legacy-imports.sh
      - name: Check for do-not-commit / dev-preview markers
        run: bash scripts/ci/check-no-donotcommit-markers.sh

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexa_test
          POSTGRES_PASSWORD: nexa_test
          POSTGRES_DB: nexa_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexa_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EVENT_REVIEWS_TEST_DATABASE_URL: postgresql://nexa_test:nexa_test@localhost:5432/nexa_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Git for long paths
        run: git config --global core.longpaths true
      - uses: pnpm/action-setup@5eea8caf49c844361c1e9ddc1324e179c54b58e9 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared
        run: pnpm --filter @g88/shared build
      - name: Test runtime renderer policy verifier
        run: node --test scripts/check-runtime-renderer-policy.test.mjs
      - name: Test Render PR-preview database isolation guard
        run: node --test apps/backend/scripts/preview-db-guard.test.cjs
      - name: Test fail-closed migration history preflight (read-only)
        run: node --test apps/backend/scripts/migration-history-guard.test.cjs
      - name: Test owner-supplied migration drift inventory (offline, always blocking)
        run: node --test apps/backend/scripts/migration-reconciliation-report.test.cjs
      - name: Test exact candidate source evidence for all 15 historic drift names
        run: node --test apps/backend/scripts/migration-source-candidates.test.cjs
      - name: Test read-only DB target attestation (fake DB, no connection)
        run: node --test apps/backend/scripts/db-target-attestation.test.cjs
      - name: Test offline production-vs-staging identity guard (no DB connection)
        run: node --test apps/backend/scripts/staging-target-preflight.test.cjs
      - name: Test migration guard against disposable local PostgreSQL (no production URL)
        env:
          NEXUS_EPHEMERAL_PG_INTEGRATION: 'true'
        run: node --test apps/backend/scripts/migration-history-guard.pg.test.cjs
      - name: Migration prefix uniqueness
        run: node apps/backend/scripts/check-migration-prefixes.mjs
      - name: Lint
        run: pnpm --filter @g88/backend exec eslint src --ext .ts --max-warnings 0
      - name: Typecheck
        run: pnpm --filter @g88/backend typecheck
      - name: Test
        run: pnpm --filter @g88/backend exec jest --ci --runInBand
      - name: Build
        run: pnpm --filter @g88/backend build

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Git for long paths
        run: git config --global core.longpaths true
      - uses: pnpm/action-setup@5eea8caf49c844361c1e9ddc1324e179c54b58e9 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared
        run: pnpm --filter @g88/shared build
      - name: Lint
        run: pnpm --filter @g88/mobile exec eslint src --ext .ts,.tsx --max-warnings 0
      - name: Typecheck
        run: pnpm --filter @g88/mobile typecheck
      - name: Test MapLibre release config gate
        run: node --test apps/mobile/scripts/maplibre-release-config.test.mjs
      - name: Test production legal URL gate
        run: node --test apps/mobile/scripts/legal-url-gate.test.mjs
      - name: Test
        run: pnpm --filter @g88/mobile exec jest --ci
