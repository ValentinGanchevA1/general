# SonarQube Cloud automatic-analysis configuration.
# The Figma plugin is built as a templated source bundle and its generated output:
# - plugin.template.js: self-contained runtime template (intentionally repeats assets)
# - code.js: generated by build.mjs from the template and shared design tokens
# Figma QA enforces exact generated-output parity plus structural tests.
# Exclude ONLY these two Figma bundle surfaces from CPD duplication measurement;
# both still receive normal source/security analysis and the Quality Gate stays on.
sonar.cpd.exclusions=tools/figma/nexa-library/code.js,tools/figma/nexa-library/plugin.template.js
